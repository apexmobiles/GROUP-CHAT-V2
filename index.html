<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0D0D0D"><title>BRO CODE</title><style>

-radius:12px;flex:0 0 46px}.hi{min-width:0}.title{font-weight:1000;font-size:14px}.status{font-size:9px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sp{flex:1}.ib{width:38px;height:38px;border-radius:10px;background:transparent;color:var(--a);font-size:18px}.chat{position:relative;flex:1;min-height:0;overflow:hidden}.cover{position:absolute;inset:0;background:#0D0D0D;overflow:hidden}.cover img{width:100%;height:auto;min-height:100%;object-fit:cover;object-position:center;position:absolute;left:50%;top:0;transform:translateX(-50%)}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(#0D0D0D30,#0D0D0D55 45%,#0D0D0De8)}.coverhint{position:absolute;inset:0;display:grid;place-items:center;color:#776E68;font-size:10px}.msgs{position:relative;z-index:3;height:100%;overflow-y:auto;padding:15px 10px 18px}.row{display:flex;margin:5px 0}.mine{justify-content:flex-end}.bubble{max-width:min(80%,520px);padding:8px 10px 6px;background:#42121Df2;border:1px solid #713142;border-radius:7px 15px 15px 15px;box-shadow:0 4px 14px #0007}.mine .bubble{background:#F4F1EAf5;color:#151313;border-color:#FFF8FB;border-radius:15px 7px 15px 15px}.sender{font-size:9px;font-weight:1000;color:var(--a);margin-bottom:4px}.mine .sender{color:#765D3D}.text{font-size:14px;line-height:1.42;white-space:pre-wrap;word-break:break-word}.time{font-size:8px;text-align:right;color:#C5BDB7;margin-top:4px}.mine .time{color:#756F69}.act{display:flex;gap:4px;margin-top:5px}.act button{padding:4px 7px;border-radius:6px;background:#342327;color:var(--a);font-size:8px;font-weight:900}.mine .act button{background:#DDD7CE;color:#241032}.media{display:block;max-width:100%;max-height:320px;border-radius:10px;margin-top:2px}audio{width:min(260px,100%);height:38px;margin-top:2px}.file{display:flex;align-items:center;gap:9px;padding:9px;margin-top:2px;border-radius:10px;background:#0C0C0Caa;min-width:190px;max-width:280px}.fi{width:35px;height:35px;border-radius:8px;display:grid;place-items:center;background:var(--a);color:#151313;font-size:8px;font-weight:1000}.fn{font-size:10px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.typing{position:absolute;left:12px;bottom:5px;z-index:8;font-size:9px;font-weight:800;text-shadow:0 2px 8px #000}.banner{position:absolute;top:0;left:0;right:0;z-index:10;display:none;padding:7px;text-align:center;background:#42121De8;color:#FFD9E6;font-size:9px;font-weight:1000}.banner.show{display:block}.composer{display:flex;align-items:flex-end;gap:6px;padding:7px;background:#121010;border-top:1px solid var(--line);z-index:15;padding-bottom:calc(7px + env(safe-area-inset-bottom))}.cb{width:40px;height:40px;flex:0 0 40px;border-radius:11px;background:#241A1D;color:var(--a);font-size:17px}.send{background:#641C2B;color:#fff}.inp{flex:1;min-width:0;min-height:40px;max-height:115px;resize:none;outline:0;padding:9px 11px;background:#0C0C0C;color:var(--txt);border:1px solid var(--line);border-radius:11px;line-height:20px}.em{position:absolute;right:9px;bottom:66px;z-index:20;display:flex;align-items:center;gap:7px;padding:5px 6px 5px 9px;background:#121010ee;border:1px solid var(--line);border-radius:20px}.em span{font-size:8px;color:var(--muted);font-weight:1000}.toggle{width:36px;height:20px;border-radius:20px;background:#40383A;padding:2px}.dot{width:16px;height:16px;border-radius:50%;background:#AAA19B;transition:.2s}.toggle.active{background:var(--danger)}.toggle.active .dot{transform:translateX(16px);background:#fff}.overlay{position:fixed;inset:0;z-index:100;background:#000b;display:none;align-items:flex-end}.overlay.show{display:flex}.sheet{width:100%;max-width:960px;margin:auto;background:#151313;border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:17px}.handle{width:42px;height:4px;background:#51484A;border-radius:5px;margin:0 auto 15px}.sheettitle{font-size:12px;font-weight:1000;color:var(--a);margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.grid button{min-height:62px;border-radius:11px;background:#241A1D;color:var(--txt);border:1px solid var(--line);font-size:9px;font-weight:1000}.modal{position:fixed;inset:0;z-index:110;background:#000c;display:none;place-items:center;padding:20px}.modal.show{display:grid}.card{width:min(410px,100%);padding:19px;background:#151313;border:1px solid var(--line);border-radius:16px}.ct{font-size:14px;font-weight:1000;color:var(--a);margin-bottom:14px}.setting{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #2d1c3b}.setting span{font-size:10px;font-weight:800}.small{padding:8px 10px;border-radius:7px;background:#302124;color:var(--a);font-size:8px;font-weight:1000}.close{width:100%;height:42px;margin-top:15px;border-radius:10px;background:var(--a);color:#151313;font-weight:1000}.call{text-align:center}.calllogo{width:120px;height:70px;object-fit:contain}.callname{font-size:17px;font-weight:1000}.calldesc{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.5}.callrow{display:flex;gap:7px;margin-top:17px}.callrow button{flex:1;height:42px;border-radius:9px;background:#302124;color:#fff;font-size:9px;font-weight:1000}.callrow .allow{background:var(--a);color:#151313}@media(min-width:700px){body{padding:15px;background:#090909}.app{height:calc(100vh - 30px);border:1px solid var(--line);border-radius:20px}}
